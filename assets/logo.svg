<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68" fill="none">
  <!-- Brand Icon Emblem -->
  <g transform="translate(4, 6)">
    <!-- Shield / Trade Gateway Dynamic Form -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#17232B"/>
    
    <!-- Stylized Africa-Europe Gateway Vector -->
    <!-- Lower Origin Arc (African Agricultural Roots) -->
    <path d="M14 40 C14 30 22 24 32 24 C38 24 43 27 45 32" stroke="#53665A" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Dynamic Glowing Connection Arc (Trade Route to Europe) -->
    <path d="M18 42 C24 22 36 14 44 14" stroke="#F7941D" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Golden Harvest & Market Node -->
    <circle cx="44" cy="14" r="4.5" fill="#F7941D"/>
    <circle cx="44" cy="14" r="2" fill="#FFFFFF"/>
    
    <!-- Origin Seed/Produce Node -->
    <circle cx="16" cy="40" r="3.5" fill="#53665A"/>
    
    <!-- Central Bridge Node -->
    <circle cx="28" cy="27" r="2.5" fill="#D9C9AE"/>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(72, 10)">
    <!-- EURO AFRIC FOODS -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="1.8" fill="#F7F5EF">EURO AFRIC FOODS</text>
    
    <!-- Tagline: Fresh Connect -->
    <text x="1" y="44" font-family="'Inter', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="3.2" fill="#F7941D" text-transform="uppercase">Fresh Connect</text>
    
    <!-- Precision Separation Accent Line -->
    <line x1="126" y1="40" x2="225" y2="40" stroke="#53665A" stroke-width="1" stroke-opacity="0.6"/>
  </g>
</svg>
