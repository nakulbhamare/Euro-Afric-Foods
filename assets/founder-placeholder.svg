<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="founderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2A34" />
      <stop offset="50%" stop-color="#17232B" />
      <stop offset="100%" stop-color="#0F171D" />
    </linearGradient>
    
    <!-- Accent Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7941D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#53665A" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Radial Pattern -->
    <radialGradient id="nodeGlow" cx="50%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#F7941D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#17232B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" fill="url(#founderBg)" />
  <circle cx="300" cy="285" r="220" fill="url(#nodeGlow)" />

  <!-- Subtle Precision Framing Grid -->
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" stroke-dasharray="4,6" rx="4"/>
  
  <!-- Outer Corner Accents -->
  <path d="M25 50 L25 25 L50 25" stroke="#F7941D" stroke-width="2.5" fill="none"/>
  <path d="M575 50 L575 25 L550 25" stroke="#F7941D" stroke-width="2.5" fill="none"/>
  <path d="M25 700 L25 725 L50 725" stroke="#F7941D" stroke-width="2.5" fill="none"/>
  <path d="M575 700 L575 725 L550 725" stroke="#F7941D" stroke-width="2.5" fill="none"/>

  <!-- Executive Silhouette / Monogram Shield -->
  <g transform="translate(300, 260)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="105" fill="#1C2B36" stroke="#243745" stroke-width="2"/>
    <circle cx="0" cy="0" r="92" fill="#17232B" stroke="#F7941D" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Subtle Executive Profile Silhouette Vector -->
    <path d="M-40 45 C-40 10 -25 -10 0 -10 C25 -10 40 10 40 45 Z" fill="#2A3D4C"/>
    <circle cx="0" cy="-35" r="28" fill="#364E60"/>

    <!-- Monogram Overlay -->
    <text x="0" y="7" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="4" fill="#F7941D" text-anchor="middle">NI</text>
  </g>

  <!-- Typography & Labeling -->
  <g transform="translate(300, 440)" text-anchor="middle">
    <!-- Tag -->
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="3.5" fill="#F7941D" text-transform="uppercase">FOUNDER PHOTOGRAPH</text>
    
    <!-- Founder Name -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="2" fill="#FFFFFF">NSUBUNGA ISA</text>
    
    <!-- Title -->
    <text x="0" y="70" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#D9C9AE">Founder &amp; CEO, Euro Afric Foods</text>
    
    <!-- Subtitle instruction -->
    <text x="0" y="115" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="rgba(247, 245, 239, 0.65)">Official LinkedIn Profile Photograph Placement</text>

    <!-- LinkedIn Pill -->
    <g transform="translate(-110, 150)">
      <rect x="0" y="0" width="220" height="42" rx="3" fill="#0A66C2" fill-opacity="0.15" stroke="#0A66C2" stroke-width="1.2"/>
      <!-- LinkedIn Icon -->
      <path d="M22 15 h4 v14 h-4 z M24 10.5 a2.5 2.5 0 1 1 0 5 a2.5 2.5 0 1 1 0 -5 M30 15 h3.8 v2 h0.1 c0.5-1 1.8-2.2 3.8-2.2 c4 0 4.8 2.6 4.8 6.1 v8.1 h-4 v-7.2 c0-1.7 0-3.9-2.4-3.9 c-2.4 0-2.8 1.8-2.8 3.8 v7.3 h-4 z" fill="#0A66C2"/>
      <text x="118" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">VERIFIED PROFILE</text>
    </g>
  </g>
</svg>
